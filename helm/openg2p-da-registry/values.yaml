# DA Registry — values overlay for the openg2p-registry chart.
#
# This chart owns no templates; everything comes from the openg2p-registry
# subchart (pinned in Chart.yaml, aliased `registry`) with the overrides below.
#
#     helm dependency update ./helm/openg2p-da-registry
#     helm install da-registry ./helm/openg2p-da-registry
#
# Release name: use `da-registry`. The subchart caps it at 18 characters, and
# it names the Keycloak client (<release>-staff-portal), which must be
# `da-registry-staff-portal`: the IAM application, the DA Services roles and
# the data policies (docs/rbac-registry-roles.md) all use that mnemonic.
#
# NOT YET DEPLOYABLE AS-IS: the DA namespace, public hostnames, image registry
# and the shared commons services (Postgres, Keycloak, master data, MinIO, AWE)
# are still to be confirmed with DevOps. Values marked TODO depend on that.
#
# Two kinds of override:
#   * global.*    — Helm propagates these to the subchart (and its subcharts).
#   * registry.*  — values for the openg2p-registry subchart itself.

# ── Globals (propagate to the openg2p-registry subchart) ──────────────────────
global:
  registryVariant: 'da-registry'
  # TODO(devops): public hostname for this registry.
  registryHostname: '{{ .Release.Name }}.{{ .Release.Namespace }}.openg2p.org'

  # AWE posts its approval decision straight to the staff API Service rather
  # than through the public ingress (the farmer deployment learned that an
  # ingress signed by a private CA breaks this call). The payload is
  # HMAC-signed, so the in-cluster hop stays authenticated.
  aweDefaultCallbackUrl: 'http://{{ .Release.Name }}-staff-portal-api/awe/webhooks/decision'

  # Browser-facing MinIO host. Pre-signed URLs are signed for this host, so the
  # browser and the API must use the same name. TODO(devops): set per environment.
  # minioHost: 'minio-api.{{ .Release.Namespace }}.openg2p.org'
  # minioSecure: true

  # TODO(devops): on the shared cluster this is likely
  # commons-postgresql.commons.svc.cluster.local (as livestock uses).
  postgresqlHost: commons-postgresql
  registryDB:  '{{ printf "%s" .Release.Name | replace "-" "_" }}'
  registryDBPort: 5432
  registryDBUser: '{{ printf "%s_user" .Release.Name | replace "-" "_" }}'
  registryDBSecret: '{{ .Release.Name }}'
  registryDBUserPasswordKey: '{{ .Release.Name }}-db-user'
  # On platform 1.2 every registry pod, the celery worker included, reads
  # Master Data over HTTP (global.masterDataApiUrl, token for
  # global.authClientId); the subchart wires that. The DA import enricher uses
  # the same API, so no pod reads the Master Data database.

# ── openg2p-registry subchart overrides ───────────────────────────────────────
registry:
  # DA-built images (each FROM the matching openg2p-registry base image).
  # TODO(devops): repository = the ECR path the Jenkinsfile pushes to
  # (<account>.dkr.ecr.ap-south-1.amazonaws.com/openg2p/da-registry, one repo, tag
  # <component>-<commit> or <component>-develop);
  # CI or the deploy step sets the tag.
  # *_APPLICATION_REFERENCE_FORMAT: four random digits instead of the platform's one,
  # so records arriving in the same second do not collide during bulk import.
  # DAs from file import / partner ingestion get the same two-level approval
  # as a web-form submission; nothing is approved automatically. The worker opens
  # the approval request with a Keycloak client-credentials token: set
  # DA_AWE_TOKEN_URL, DA_AWE_CLIENT_ID and DA_AWE_CLIENT_SECRET (a confidential
  # client with service accounts enabled, e.g. da-registry-backend) on the
  # celery worker, the staff API and the partner API; put the secret in
  # envVarsFrom. See da-extension services/import_approval_workflow.py.
  staffApi:
    envVars:
      REGISTRY_STAFF_PORTAL_API_APPLICATION_REFERENCE_FORMAT: "{DATE:%Y%b%d|upper}-{SECONDS:5}-{RAND:4}"
    image:
      repository: openg2p/da-registry
      tag: staff-api-develop
  staffUi:
    image:
      repository: openg2p/da-registry
      tag: staff-ui-develop
  partnerApi:
    envVars:
      # Imports open their approval request from this process (service token),
      # so it needs the AWE settings the platform chart gives only the staff API.
      REGISTRY_PARTNER_API_AWE_ENABLED: '{{ .Values.global.aweEnabled }}'
      REGISTRY_PARTNER_API_AWE_BASE_URL: '{{ tpl .Values.global.aweBaseUrl $ }}'
      REGISTRY_PARTNER_API_AWE_DEFAULT_CALLBACK_URL: '{{ tpl .Values.global.aweDefaultCallbackUrl $ }}'
      REGISTRY_PARTNER_API_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId $ }}'
      REGISTRY_PARTNER_API_APPLICATION_REFERENCE_FORMAT: "{DATE:%Y%b%d|upper}-{SECONDS:5}-{RAND:4}"
      # DCI expression search: the platform's default fields plus the DA location (names and codes), position and last_approved_at (changes since), so DA Services can filter exactly by Woreda / Kebele.
      # registry-platform 1.2.2-rc.557 reads DCI_ALLOWED_SEARCH_FIELDS (rc.544: DCI_EXPRESSION_ALLOWED_FIELDS); the old name is ignored and every DA filter field is then "not searchable".
      REGISTRY_PARTNER_API_DCI_ALLOWED_SEARCH_FIELDS: '["functional_record_id","first_name","middle_name","last_name","given_name","gender","birth_date","foundational_id","record_name","record_status","search_text","marital_status","income_level","education_level","residency_status","disability_status","displacement_status","region_name","zone_name","woreda_name","kebele_name","geo_lowest_level_value_id","position","specialisation","upstream_reference","region_code","zone_code","woreda_code","last_approved_at"]'
    image:
      repository: openg2p/da-registry
      tag: partner-api-develop
  celeryWorker:
    envVars:
      # Imports open their approval request from this process (service token),
      # so it needs the AWE settings the platform chart gives only the staff API.
      REGISTRY_CELERY_WORKERS_AWE_ENABLED: '{{ .Values.global.aweEnabled }}'
      REGISTRY_CELERY_WORKERS_AWE_BASE_URL: '{{ tpl .Values.global.aweBaseUrl $ }}'
      REGISTRY_CELERY_WORKERS_AWE_DEFAULT_CALLBACK_URL: '{{ tpl .Values.global.aweDefaultCallbackUrl $ }}'
      REGISTRY_CELERY_WORKERS_AWE_CALLBACK_SECRET_ID: '{{ tpl .Values.global.aweCallbackSecretId $ }}'
      REGISTRY_CELERY_WORKERS_APPLICATION_REFERENCE_FORMAT: "{DATE:%Y%b%d|upper}-{SECONDS:5}-{RAND:4}"
    image:
      repository: openg2p/da-registry
      tag: celery-develop
  celeryBeat:
    image:
      repository: openg2p/da-registry
      tag: celery-develop
  dbSeed:
    image:
      repository: openg2p/da-registry
      tag: db-seed-develop
    # Sample DAs come from the openg2p-data pack baked into the db-seed image
    # (packs/ETH-OAN/samples/development_agents.json); off outside local dev.
    # Geography and the dropdown code lists come from the Master Data service,
    # seeded by openg2p-data's master-data-db-seed with PACK_DOMAINS=agriculture
    # (the DA_* lists live in that domain), never from the registry seed.
    loadSampleData: false
    loadImages: false
    loadTemplates: true

  # Name of this registry's tile in IAM.
  iamRegister:
    applicationDescription: "DA Registry"

  # Functional-ID pools, one per register (key = register mnemonic, lowercased).
  # Helm merges maps, so the subchart's reference pools are still provisioned;
  # that is harmless.
  idgenerator:
    idGenerator:
      appConfig:
        idTypes:
          da:
            idLength: 10

  # The DA e2e sanity suite does not exist yet; keep the subchart's reference
  # suite off rather than run it against a register it does not know.
  sanity:
    enabled: false
